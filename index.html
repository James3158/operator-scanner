<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Operator Scanner</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <style>
        :root { --matrix-green: #00ff41; --bg-color: #080808; --card-bg: #151515; --border-radius: 16px; }
        body { background-color: var(--bg-color); color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; font-size: 16px; }
        
        .nav-bar { display: flex; width: 100%; max-width: 450px; background: #222; border-radius: 12px; margin-bottom: 15px; overflow: hidden; }
        .nav-btn { flex: 1; padding: 15px; text-align: center; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; color: #888; cursor: pointer; transition: 0.2s; }
        .nav-btn.active { background: var(--matrix-green); color: #000; }
        
        h2 { font-size: 1.4rem; font-weight: 800; color: #fff; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 15px; text-align: center; width: 100%; }
        
        /* Suchleiste */
        #search-container { width: 100%; max-width: 450px; display: flex; gap: 10px; margin-bottom: 20px; }
        #searchInput { flex-grow: 1; padding: 15px; border-radius: 12px; border: 1px solid #333; background: #111; color: #fff; font-size: 16px; outline: none; }
        #searchInput:focus { border-color: var(--matrix-green); }
        #searchBtn { background: #222; color: #fff; border: 1px solid #333; border-radius: 12px; padding: 0 20px; font-weight: bold; cursor: pointer; }
        #searchBtn:active { background: var(--matrix-green); color: #000; }

        #reader-container { width: 100%; max-width: 450px; border-radius: var(--border-radius); overflow: hidden; background: #000; display: none; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8); margin-bottom: 20px; }
        #reader { width: 100%; }
        #reader img, #reader span, #reader a, #reader button, #reader div[style*="border"] { display: none !important; }
        #reader video { object-fit: cover; border-radius: var(--border-radius); }
        
        #result, #history-container { width: 100%; max-width: 450px; display: none; flex-direction: column; gap: 15px; }
        .card { background: var(--card-bg); border-radius: var(--border-radius); padding: 25px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); border: 1px solid #2a2a2a; }
        
        .history-filters { display: flex; gap: 5px; margin-bottom: 10px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; }
        .history-filters::-webkit-scrollbar { display: none; }
        .filter-btn { background: #222; color: #aaa; border: 1px solid #333; padding: 10px 14px; border-radius: 8px; font-size: 13px; font-weight: 700; text-transform: uppercase; cursor: pointer; white-space: nowrap; transition: 0.2s; }
        .filter-btn.active { background: var(--matrix-green); color: #000; border-color: var(--matrix-green); }
        
        .product-header { display: flex; gap: 20px; align-items: center; margin-bottom: 20px; }
        .product-img { width: 90px; height: 90px; object-fit: cover; border-radius: 12px; background: #222; border: 1px solid #333; }
        .product-info { flex-grow: 1; }
        .product-title { font-size: 20px; font-weight: 800; color: #fff; margin: 0 0 8px 0; line-height: 1.2; }
        .category-badge { display: inline-block; background: #333; color: #bbb; font-size: 11px; padding: 5px 10px; border-radius: 6px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px;}
        .score-circle { width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 900; border: 4px solid; flex-shrink: 0; background: #000; }
        
        .status-banner { padding: 15px; border-radius: 8px; font-weight: 800; font-size: 16px; text-align: center; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
        .status-alert { background: rgba(255, 59, 48, 0.15); color: #ff3b30; border: 1px solid rgba(255, 59, 48, 0.4); }
        .status-clean { background: rgba(52, 199, 89, 0.15); color: #34c759; border: 1px solid rgba(52, 199, 89, 0.4); }
        
        .section-title { font-size: 14px; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; font-weight: 700; border-bottom: 1px solid #333; padding-bottom: 6px; }
        .toxin-list { color: #ff3b30; font-size: 15px; font-weight: 600; line-height: 1.6; margin: 0; padding-left: 20px; }
        .whitelist-list { color: var(--matrix-green); font-size: 15px; font-weight: 600; line-height: 1.6; margin: 0; padding-left: 20px; }
        .alt-list { color: #fff; font-size: 14px; font-weight: 500; line-height: 1.6; margin: 0; padding-left: 20px; }
        .ingredients-text { color: #999; font-size: 13px; line-height: 1.6; margin: 0; }
        
        .history-item { background: #1a1a1a; padding: 15px; border-radius: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #333; cursor: pointer; transition: 0.1s; }
        .history-item:active { background: #2a2a2a; }
        
        button.action-btn { background: #fff; color: #000; border: none; border-radius: 12px; padding: 20px; font-weight: 800; font-size: 18px; width: 100%; max-width: 450px; cursor: pointer; transition: 0.2s; text-transform: uppercase; letter-spacing: 2px; margin-top: auto; }
        button.action-btn:active { transform: scale(0.97); background: #ccc; }
        button.ocr-btn { background: #ffcc00; color: #000; padding: 15px; font-size: 15px; text-transform: none; margin-top: 10px; display: flex; justify-content: center; align-items: center; gap: 10px; border-radius: 8px; font-weight: 700; width: 100%; border: none; cursor: pointer; }
        
        #db-status { width: 100%; max-width: 450px; margin-bottom: 10px; display: none; }
    </style>
</head>
<body>
    <h2>Operator Interface</h2>
    
    <div id="db-status" class="status-banner status-alert">
        SYSTEMFEHLER: Blacklist/Whitelist beschädigt.<br><span style="font-size:12px;">Syntax-Fehler in den JSON-Dateien. Filter ist inaktiv!</span>
    </div>

    <div class="nav-bar">
        <div id="tab-scan" class="nav-btn active" onclick="switchTab('scan')">Scanner</div>
        <div id="tab-history" class="nav-btn" onclick="switchTab('history')">Archiv</div>
    </div>
    
    <div id="search-container">
        <input type="text" id="searchInput" placeholder="Produkt manuell suchen...">
        <button id="searchBtn">SUCHE</button>
    </div>

    <div id="reader-container">
        <div id="reader"></div>
    </div>
    
    <div id="result"></div>
    
    <div id="history-container">
        <div class="history-filters">
            <button id="flt-alle" class="filter-btn active" onclick="filterHistory('Alle', 'flt-alle')">Alle</button>
            <button id="flt-nahrung" class="filter-btn" onclick="filterHistory('Nahrung', 'flt-nahrung')">Nahrung</button>
            <button id="flt-kosmetik" class="filter-btn" onclick="filterHistory('Kosmetik', 'flt-kosmetik')">Kosmetik</button>
            <button id="flt-ocr" class="filter-btn" onclick="filterHistory('Optisch', 'flt-ocr')">Optisch / OCR</button>
        </div>
        <div id="history-list"></div>
    </div>
    
    <button id="startBtn" class="action-btn">Sensor Aktivieren</button>
    <input type="file" accept="image/*" capture="environment" id="ocrInput" style="display:none;">

    <script>
        let blacklist = {};
        let whitelist = {};
        let html5QrCode;
        let currentHistoryFilter = 'Alle';
        let dbActive = false;

        const alternativeEngine = {
            "fluorid": "Miswak-Stab, naturreine Zahnkreide, Kokosöl-Ziehen.",
            "e250": "Unbehandeltes Bio-Fleisch direkt vom Metzger.",
            "aspartam": "Roher Honig, reines Wasser.",
            "sucralose": "Roher Honig, reines Wasser.",
            "zucker": "Roher Bio-Honig, isolierte Früchte.",
            "soja": "Weidefleisch, Eier (Testosteron-Basis).",
            "e471": "Single-Ingredient Nahrungsmittel.",
            "paraben": "Rindertalg (Face/Body), reines Jojobaöl, Sheabutter.",
            "phthalat": "Naturöle, Lagerung in Glasbehältern.",
            "aluminium": "Natürliche Alaunsteine, Verzicht auf synthetische Deos.",
            "sls": "Traditionelle Aleppo-Seife (Oliven/Lorbeeröl), Kernseife.",
            "sles": "Aleppo-Seife, Wascherde (Rhassoul) für Haut und Haare.",
            "dimethicone": "Arganöl für die Haare. Verzicht auf Silikon-Versiegelungen.",
            "parfum": "Reine ätherische Öle, Eigengeruch des Körpers zulassen.",
            "peg-": "Pflanzliche Basisöle. Verzicht auf Emulgatoren."
        };

        let timestamp = new Date().getTime();
        Promise.all([
            fetch('blacklist.json?v=' + timestamp).then(r => r.json()),
            fetch('whitelist.json?v=' + timestamp).then(r => r.json())
        ]).then(data => {
            blacklist = data[0];
            whitelist = data[1];
            dbActive = true;
        }).catch(err => {
            document.getElementById('db-status').style.display = 'block';
            console.error("JSON Syntax Error:", err);
        });

        function switchTab(tab) {
            if (html5QrCode && html5QrCode.isScanning) html5QrCode.stop();
            document.getElementById('tab-scan').className = tab === 'scan' ? 'nav-btn active' : 'nav-btn';
            document.getElementById('tab-history').className = tab === 'history' ? 'nav-btn active' : 'nav-btn';
            
            if (tab === 'scan') {
                document.getElementById('history-container').style.display = 'none';
                document.getElementById('result').style.display = 'none';
                document.getElementById('reader-container').style.display = 'none';
                document.getElementById('search-container').style.display = 'flex';
                document.getElementById('startBtn').style.display = 'block';
                document.getElementById('startBtn').innerText = 'Sensor Aktivieren';
            } else {
                document.getElementById('reader-container').style.display = 'none';
                document.getElementById('result').style.display = 'none';
                document.getElementById('startBtn').style.display = 'none';
                document.getElementById('search-container').style.display = 'none';
                document.getElementById('history-container').style.display = 'flex';
                renderHistory();
            }
        }

        // --- HISTORIE & FILTER LOGIK FIX ---
        function saveToHistory(barcode, name, score, category, rawIngredients = null) {
            let history = JSON.parse(localStorage.getItem('op_history')) || [];
            history = history.filter(item => item.barcode !== barcode);
            
            // Standardisierung der Kategorie für den Filter
            let mainCategory = "Nahrung";
            if (category.includes("Kosmetik")) mainCategory = "Kosmetik";
            if (category.includes("Optisch") || category.includes("OCR")) mainCategory = "Optisch";

            history.unshift({ barcode, name, score, category: mainCategory, rawIngredients, date: new Date().toLocaleDateString() });
            if (history.length > 100) history.pop();
            localStorage.setItem('op_history', JSON.stringify(history));
        }

        function filterHistory(category, btnId) {
            currentHistoryFilter = category;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(btnId).classList.add('active');
            renderHistory();
        }

        function renderHistory() {
            let history = JSON.parse(localStorage.getItem('op_history')) || [];
            let html = '';
            
            let filtered = history;
            if (currentHistoryFilter !== 'Alle') {
                filtered = history.filter(item => item.category && item.category === currentHistoryFilter);
            }

            if (filtered.length === 0) {
                html = '<div class="card" style="text-align:center;color:#888;">Keine Einträge.</div>';
            } else {
                filtered.forEach(item => {
                    let sColor = item.score >= 80 ? '#34c759' : (item.score >= 40 ? '#ffcc00' : '#ff3b30');
                    html += `
                    <div class="history-item" onclick="loadFromArchive('${item.barcode}')">
                        <div style="flex-grow:1; padding-right:10px; overflow:hidden;">
                            <span class="category-badge">${item.category}</span><br>
                            <strong style="font-size:15px;color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block;">${item.name}</strong>
                            <span style="font-size:11px;color:#777;">ID: ${item.barcode} | ${item.date}</span>
                        </div>
                        <div style="font-weight:900; font-size:20px; color:${sColor};">${item.score}</div>
                    </div>`;
                });
            }
            document.getElementById('history-list').innerHTML = html;
        }

        function loadFromArchive(barcode) {
            switchTab('scan');
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('search-container').style.display = 'none';
            document.getElementById('result').innerHTML = `<div class="card" style="text-align:center;">Lade Archiv...</div>`;
            document.getElementById('result').style.display = 'flex';
            
            let history = JSON.parse(localStorage.getItem('op_history')) || [];
            let archivedItem = history.find(i => i.barcode === barcode);
            
            if (archivedItem && archivedItem.rawIngredients) {
                let fakeData = { product: { product_name: archivedItem.name, ingredients_text: archivedItem.rawIngredients, image_url: "" } };
                analyzeProduct(fakeData, archivedItem.category, barcode, true);
            } else {
                fetchDataCascade(barcode);
            }
        }

        // --- NEUE SUCH-LOGIK (Listen-Auswahl) ---
        document.getElementById('searchBtn').addEventListener('click', () => {
            let term = document.getElementById('searchInput').value.trim();
            if(!term) return;
            
            document.getElementById('reader-container').style.display = "none";
            document.getElementById('result').style.display = 'flex';
            document.getElementById('result').innerHTML = `<div class="card" style="text-align:center;">Analysiere Datenbanken nach [${term}]...</div>`;
            
            // Suche Nahrung
            fetch(`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(term)}&search_simple=1&action=process&json=1&page_size=15`)
            .then(r => r.json())
            .then(data => {
                if(data.products && data.products.length > 0) {
                    renderSearchResults(data.products, "Nahrung (Manuelle Suche)");
                } else {
                    // Suche Kosmetik als Fallback
                    fetch(`https://world.openbeautyfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(term)}&search_simple=1&action=process&json=1&page_size=15`)
                    .then(rb => rb.json())
                    .then(dataB => {
                        if(dataB.products && dataB.products.length > 0) {
                            renderSearchResults(dataB.products, "Kosmetik (Manuelle Suche)");
                        } else {
                            document.getElementById('result').innerHTML = `<div class="card status-banner status-alert">Kein Matrix-Eintrag gefunden.</div>`;
                        }
                    });
                }
            }).catch(() => {
                document.getElementById('result').innerHTML = `<div class="card status-banner status-alert">Such-Interferenz.</div>`;
            });
        });

        function renderSearchResults(products, categoryStr) {
            let html = `<div class="card" style="padding:15px;"><div class="section-title">Ergebnisse: ${categoryStr}</div>`;
            products.forEach(p => {
                let name = p.product_name || "Unbekannte Deklaration";
                let brand = p.brands || "Unbekannte Marke";
                let img = p.image_front_small_url || p.image_url || "";
                let imgHtml = img ? `<img src="${img}" style="width:45px;height:45px;border-radius:6px;object-fit:cover;border:1px solid #333;">` : `<div style="width:45px;height:45px;background:#222;border-radius:6px;border:1px solid #333;"></div>`;
                
                let safeData = encodeURIComponent(JSON.stringify(p));
                html += `
                <div onclick="selectSearchResult('${p.code || name}', '${categoryStr}', '${safeData}')" style="display:flex;gap:15px;align-items:center;background:#1a1a1a;padding:12px;border-radius:8px;margin-bottom:10px;cursor:pointer;border:1px solid #2a2a2a;transition:0.2s;">
                    ${imgHtml}
                    <div style="flex-grow:1; overflow:hidden;">
                        <strong style="color:#fff;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;">${name}</strong>
                        <span style="font-size:11px;color:#888;">${brand}</span>
                    </div>
                </div>`;
            });
            html += `</div>`;
            document.getElementById('result').innerHTML = html;
        }

        function selectSearchResult(barcode, category, dataStr) {
            let p = JSON.parse(decodeURIComponent(dataStr));
            document.getElementById('result').innerHTML = `<div class="card" style="text-align:center;">Extrahiere Rohdaten...</div>`;
            analyzeProduct({status: 1, product: p}, category, barcode);
        }

        // --- ANALYSE ---
        function analyzeProduct(data, category, barcode, isOcr = false) {
            if(!dbActive) {
                alert("Datenbank-Fehler. Filter inaktiv.");
                return;
            }

            let p = data.product;
            let ingredientsRaw = [
                p.ingredients_text_de || "",
                p.ingredients_text_en || "",
                p.ingredients_text || "",
                p.ingredients_tags ? p.ingredients_tags.join(" ") : ""
            ].join(" ").toLowerCase();

            let productName = p.product_name || "Unbekanntes Objekt";
            let imageHtml = p.image_url ? `<img src="${p.image_url}" class="product-img">` : `<div class="product-img" style="display:flex;align-items:center;justify-content:center;font-size:10px;color:#555;text-align:center;">NO<br>IMG</div>`;
            
            if (ingredientsRaw.trim() === "" && !isOcr && !category.includes("Manuelle Suche")) {
                let resultHtml = `
                    <div class="card">
                        <div class="product-header">
                            ${imageHtml}
                            <div class="product-info">
                                <div class="category-badge">${category}</div>
                                <h3 class="product-title">${productName}</h3>
                            </div>
                        </div>
                        <div class="status-banner status-alert">Keine Textdaten in API.</div>
                        <button class="ocr-btn" onclick="document.getElementById('ocrInput').click()">📸 Zutaten fotografieren (OCR)</button>
                    </div>`;
                document.getElementById('result').innerHTML = resultHtml;
                document.getElementById('ocrInput').onchange = (e) => {
                    if(e.target.files.length > 0) processOCR(e.target.files[0], productName, barcode);
                };
                return;
            }

            let foundToxins = [];
            let foundGood = [];
            let suggestedAlts = new Set();
            let score = 100;

            if (ingredientsRaw.trim() !== "") {
                for (let toxin in blacklist) {
                    if (ingredientsRaw.includes(toxin.toLowerCase())) {
                        foundToxins.push(`<b>${toxin.toUpperCase()}</b>: ${blacklist[toxin]}`);
                        score -= 25;
                        for (let key in alternativeEngine) {
                            if (toxin.toLowerCase().includes(key)) suggestedAlts.add(alternativeEngine[key]);
                        }
                    }
                }
                for (let good in whitelist) {
                    if (ingredientsRaw.includes(good.toLowerCase())) {
                        foundGood.push(`<b>${good.toUpperCase()}</b>: ${whitelist[good]}`);
                        score += 5;
                    }
                }
            }

            if (score < 0) score = 0;
            if (score > 100) score = 100;

            let scoreColor = score >= 80 ? '#34c759' : (score >= 40 ? '#ffcc00' : '#ff3b30');
            saveToHistory(barcode, productName, score, category, (isOcr || category.includes("Manuelle Suche")) ? ingredientsRaw : null);

            let resultHtml = `
                <div class="card">
                    <div class="product-header">
                        ${imageHtml}
                        <div class="product-info">
                            <div class="category-badge">${category}</div>
                            <h3 class="product-title">${productName}</h3>
                        </div>
                        <div class="score-circle" style="color: ${scoreColor}; border-color: ${scoreColor};">
                            ${score}
                        </div>
                    </div>
            `;

            if (foundToxins.length > 0) {
                resultHtml += `<div class="status-banner status-alert">ANGRIFF DETEKTIERT</div>`;
                resultHtml += `<div style="margin-bottom: 20px;"><div class="section-title">Kritische Toxine</div><ul class="toxin-list"><li>${foundToxins.join('</li><li>')}</li></ul></div>`;
            } else {
                resultHtml += `<div class="status-banner status-clean">STATUS: REIN</div>`;
            }

            if (foundGood.length > 0) {
                resultHtml += `<div style="margin-bottom: 20px;"><div class="section-title">Biologische Verstärker</div><ul class="whitelist-list"><li>${foundGood.join('</li><li>')}</li></ul></div>`;
            }

            if (suggestedAlts.size > 0) {
                resultHtml += `<div style="margin-bottom: 20px;"><div class="section-title">Souveräne Alternativen</div><ul class="alt-list"><li>${Array.from(suggestedAlts).join('</li><li>')}</li></ul></div>`;
            }

            resultHtml += `
                <div>
                    <div class="section-title">Rohdaten</div>
                    <p class="ingredients-text">${p.ingredients_text_de || p.ingredients_text || "Lokaler Speicher / API"}</p>
                </div>
            </div>`;
            
            document.getElementById('result').innerHTML = resultHtml;
        }

        function processOCR(file, productName, barcode) {
            document.getElementById('result').innerHTML = `<div class="card" style="text-align:center;"><div class="status-banner status-ocr">Erkennung läuft...</div></div>`;
            Tesseract.recognize(file, 'deu+eng').then(({ data: { text } }) => {
                let fakeData = { product: { product_name: productName, ingredients_text: text, image_url: "" } };
                analyzeProduct(fakeData, "Optischer Scan", barcode, true);
            }).catch(err => {
                document.getElementById('result').innerHTML = `<div class="card"><div class="status-banner status-alert">OCR gescheitert.</div><button class="ocr-btn" onclick="document.getElementById('ocrInput').click()">📸 Neuer Versuch</button></div>`;
            });
        }

        function fetchDataCascade(barcode) {
            fetch(`https://world.openfoodfacts.org/api/v0/product/${barcode}.json`)
                .then(res => res.json())
                .then(data => {
                    if (data.status === 1) analyzeProduct(data, "Nahrung", barcode);
                    else {
                        fetch(`https://world.openbeautyfacts.org/api/v0/product/${barcode}.json`)
                            .then(resB => resB.json())
                            .then(dataB => {
                                if (dataB.status === 1) analyzeProduct(dataB, "Kosmetik", barcode);
                                else {
                                    document.getElementById('result').innerHTML = `
                                    <div class="card"><div class="status-banner status-alert">Nicht katalogisiert.</div>
                                    <button class="ocr-btn" onclick="document.getElementById('ocrInput').click()">📸 Zutaten fotografieren</button></div>`;
                                    document.getElementById('ocrInput').onchange = (e) => {
                                        if(e.target.files.length > 0) processOCR(e.target.files[0], "Unbekanntes Objekt", barcode);
                                    };
                                }
                            });
                    }
                }).catch(() => document.getElementById('result').innerHTML = `<div class="card status-banner status-alert">Server-Interferenz.</div>`);
        }

        function onScanSuccess(decodedText) {
            html5QrCode.stop().then(() => {
                document.getElementById('reader-container').style.display = "none";
                document.getElementById('startBtn').style.display = "block";
                document.getElementById('startBtn').innerText = "Neuen Code Scannen";
                document.getElementById('search-container').style.display = 'none';
                
                document.getElementById('result').innerHTML = `<div class="card" style="text-align:center; font-weight:bold;">Signatur [${decodedText}] erfasst...</div>`;
                document.getElementById('result').style.display = "flex";
                
                fetchDataCascade(decodedText);
            });
        }

        // --- SCANNER OPTIMIERUNG ---
        document.getElementById('startBtn').addEventListener('click', () => {
            document.getElementById('startBtn').style.display = "none";
            document.getElementById('result').style.display = "none";
            document.getElementById('search-container').style.display = 'none';
            document.getElementById('reader-container').style.display = "block";
            
            html5QrCode = new Html5Qrcode("reader");
            
            // Limitierung der Web-API: Format-Restriktionen entfernt, um Heuristik-Modus (Mustererkennung für Rotation) zu erzwingen.
            const config = { 
                fps: 20, // Reduziert, damit die Heuristik mehr Zeit pro Bild hat
                useBarCodeDetectorIfSupported: true, 
                videoConstraints: { 
                    facingMode: "environment", 
                    width: { ideal: 1920 }, 
                    height: { ideal: 1080 }, 
                    advanced: [{ focusMode: "continuous" }] 
                } 
            };
            
            html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess).catch(() => {
                document.getElementById('result').innerHTML = `<div class="card status-banner status-alert">Hardware-Zugriff verweigert.</div>`;
                document.getElementById('result').style.display = "flex";
                document.getElementById('startBtn').style.display = "block";
                document.getElementById('reader-container').style.display = "none";
                document.getElementById('search-container').style.display = 'flex';
            });
        });
    </script>
</body>
</html>
