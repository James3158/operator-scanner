<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Operator Scanner</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --matrix-green: #00ff41; --bg-color: #080808; --card-bg: #121212; --border-radius: 16px; }
        body { background-color: var(--bg-color); color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        h2 { font-size: 1.1rem; font-weight: 700; color: #fff; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 20px; text-align: center; border-bottom: 1px solid #333; padding-bottom: 10px; width: 100%; max-width: 400px; }
        
        /* Kamera Container */
        #reader-container { width: 100%; max-width: 400px; border-radius: var(--border-radius); overflow: hidden; background: #000; display: none; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8); margin-bottom: 20px; }
        #reader { width: 100%; }
        /* Unterdrückung fremder UI-Elemente */
        #reader img, #reader span, #reader a, #reader button, #reader div[style*="border"] { display: none !important; }
        #reader video { object-fit: cover; border-radius: var(--border-radius); }
        
        /* Resultat Container (Card Style) */
        #result { width: 100%; max-width: 360px; display: none; flex-direction: column; gap: 15px; }
        .card { background: var(--card-bg); border-radius: var(--border-radius); padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); border: 1px solid #222; }
        
        /* Produkt Header */
        .product-header { display: flex; gap: 15px; align-items: center; margin-bottom: 15px; }
        .product-img { width: 80px; height: 80px; object-fit: cover; border-radius: 10px; background: #222; border: 1px solid #333; }
        .product-title { font-size: 18px; font-weight: 700; color: #fff; margin: 0; line-height: 1.2; }
        .category-badge { display: inline-block; background: #333; color: #aaa; font-size: 10px; padding: 4px 8px; border-radius: 6px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        
        /* Status Banner */
        .status-banner { padding: 12px; border-radius: 8px; font-weight: 700; font-size: 14px; text-align: center; text-transform: uppercase; letter-spacing: 1px; }
        .status-alert { background: rgba(255, 59, 48, 0.15); color: #ff3b30; border: 1px solid rgba(255, 59, 48, 0.3); }
        .status-clean { background: rgba(52, 199, 89, 0.15); color: #34c759; border: 1px solid rgba(52, 199, 89, 0.3); }
        
        /* Listen */
        .section-title { font-size: 12px; color: #777; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 600; border-bottom: 1px solid #222; padding-bottom: 4px; }
        .toxin-list { color: #ff3b30; font-size: 13px; font-weight: 500; line-height: 1.6; margin: 0; padding-left: 15px; }
        .alt-list { color: #00ff41; font-size: 13px; font-weight: 500; line-height: 1.6; margin: 0; padding-left: 15px; }
        .ingredients-text { color: #8e8e93; font-size: 12px; line-height: 1.5; margin: 0; }
        
        /* Haupt-Button */
        button#startBtn { background: #fff; color: #000; border: none; border-radius: 12px; padding: 18px; font-weight: 700; font-size: 16px; width: 100%; max-width: 400px; cursor: pointer; transition: 0.2s; text-transform: uppercase; letter-spacing: 1px; margin-top: auto; }
        button#startBtn:active { transform: scale(0.97); background: #ccc; }
    </style>
</head>
<body>
    <h2>DATA EXTRACTION</h2>
    
    <div id="reader-container">
        <div id="reader"></div>
    </div>
    
    <div id="result"></div>
    
    <button id="startBtn">Sensor Aktivieren</button>

    <script>
        let blacklist = {};
        let html5QrCode;

        // Souveräne Alternativen Matrix
        const alternativeEngine = {
            "fluorid": "Miswak-Stab (Salvadora persica), naturreine Zahnkreide.",
            "e250": "Unbehandeltes Bio-Fleisch direkt vom Metzger.",
            "aspartam": "Roher Honig, reines Wasser.",
            "sucralose": "Roher Honig, reines Wasser.",
            "zucker": "Roher Bio-Honig, isolierter Konsum von echten Früchten.",
            "soja": "Weidefleisch, Eier (Testosteron-Basis).",
            "e471": "Single-Ingredient Nahrungsmittel (Keine Fabrikware).",
            "paraben": "Reine Kernseife, Rindertalg (Beef Tallow) für die Haut.",
            "phthalat": "Naturöle, Glasbehälter statt Plastik.",
            "aluminium": "Natürliche Alaunsteine, Verzicht auf synthetische Deos."
        };

        fetch('blacklist.json')
            .then(response => response.json())
            .then(data => { blacklist = data; })
            .catch(() => { document.getElementById('result').innerHTML = "<div class='card'>Fehler: Blacklist offline.</div>"; document.getElementById('result').style.display = "flex"; });

        function analyzeProduct(data, category) {
            let p = data.product;
            let ingredientsRaw = [
                p.ingredients_text_de || "",
                p.ingredients_text_en || "",
                p.ingredients_text || "",
                p.ingredients_tags ? p.ingredients_tags.join(" ") : ""
            ].join(" ").toLowerCase();

            let productName = p.product_name || "Unbekannte Identität";
            let imageHtml = p.image_url ? `<img src="${p.image_url}" class="product-img">` : `<div class="product-img" style="display:flex;align-items:center;justify-content:center;font-size:10px;color:#555;">KEIN BILD</div>`;
            
            let foundToxins = [];
            let suggestedAlts = new Set();

            for (let toxin in blacklist) {
                if (ingredientsRaw.includes(toxin.toLowerCase())) {
                    foundToxins.push(`<b>${toxin.toUpperCase()}</b>: ${blacklist[toxin]}`);
                    
                    // Suche nach passender Alternative
                    for (let key in alternativeEngine) {
                        if (toxin.toLowerCase().includes(key)) {
                            suggestedAlts.add(alternativeEngine[key]);
                        }
                    }
                }
            }

            let resultHtml = `
                <div class="card">
                    <div class="product-header">
                        ${imageHtml}
                        <div>
                            <div class="category-badge">${category}</div>
                            <h3 class="product-title">${productName}</h3>
                        </div>
                    </div>
            `;

            if (ingredientsRaw.trim() === "") {
                resultHtml += `
                    <div class="status-banner status-alert">Datenbank manipuliert. Keine Zutaten.</div>
                </div>`;
            } else if (foundToxins.length > 0) {
                resultHtml += `
                    <div class="status-banner status-alert">BIOLOGISCHER ANGRIFF DETEKTIERT</div>
                    <div style="margin-top: 15px;">
                        <div class="section-title">Identifizierte Toxine</div>
                        <ul class="toxin-list"><li>${foundToxins.join('</li><li>')}</li></ul>
                    </div>
                `;
                
                if (suggestedAlts.size > 0) {
                    resultHtml += `
                        <div style="margin-top: 15px;">
                            <div class="section-title">Souveräne Alternativen</div>
                            <ul class="alt-list"><li>${Array.from(suggestedAlts).join('</li><li>')}</li></ul>
                        </div>
                    `;
                }

                resultHtml += `
                    <div style="margin-top: 15px;">
                        <div class="section-title">Rohdaten (Zutaten)</div>
                        <p class="ingredients-text">${p.ingredients_text_de || p.ingredients_text || "Aus Metadaten extrahiert."}</p>
                    </div>
                </div>`;
            } else {
                resultHtml += `
                    <div class="status-banner status-clean">STATUS: REIN</div>
                    <div style="margin-top: 15px;">
                        <div class="section-title">Rohdaten (Zutaten)</div>
                        <p class="ingredients-text">${p.ingredients_text_de || p.ingredients_text}</p>
                    </div>
                </div>`;
            }
            
            document.getElementById('result').innerHTML = resultHtml;
            document.getElementById('result').style.display = "flex";
        }

        function onScanSuccess(decodedText) {
            html5QrCode.stop().then(() => {
                document.getElementById('reader-container').style.display = "none";
                let startBtn = document.getElementById('startBtn');
                startBtn.style.display = "block";
                startBtn.innerText = "Neuen Code Scannen";
                
                document.getElementById('result').innerHTML = `<div class="card" style="text-align:center;">Signatur [${decodedText}] erfasst.<br>Kontaktiere Datenbanken...</div>`;
                document.getElementById('result').style.display = "flex";
                
                fetch(`https://world.openfoodfacts.org/api/v0/product/${decodedText}.json`)
                    .then(res => res.json())
                    .then(data => {
                        if (data.status === 1) {
                            analyzeProduct(data, "Nahrungsmittel");
                        } else {
                            fetch(`https://world.openbeautyfacts.org/api/v0/product/${decodedText}.json`)
                                .then(resB => resB.json())
                                .then(dataB => {
                                    if (dataB.status === 1) {
                                        analyzeProduct(dataB, "Kosmetik / Pflege");
                                    } else {
                                        document.getElementById('result').innerHTML = `<div class="card status-banner status-alert">Objekt in keiner Datenbank katalogisiert. Black-Box Produkt.</div>`;
                                    }
                                });
                        }
                    })
                    .catch(() => {
                        document.getElementById('result').innerHTML = `<div class="card">Server-Interferenz. API blockiert.</div>`;
                    });
            });
        }

        document.getElementById('startBtn').addEventListener('click', () => {
            document.getElementById('startBtn').style.display = "none";
            document.getElementById('result').style.display = "none";
            document.getElementById('reader-container').style.display = "block";
            
            html5QrCode = new Html5Qrcode("reader");
            
            const config = { 
                fps: 30,
                formatsToSupport: [
                    Html5QrcodeSupportedFormats.EAN_13,
                    Html5QrcodeSupportedFormats.EAN_8,
                    Html5QrcodeSupportedFormats.UPC_A
                ],
                videoConstraints: {
                    facingMode: "environment",
                    width: { ideal: 1920 },
                    height: { ideal: 1080 },
                    advanced: [{ focusMode: "continuous" }]
                }
            };

            html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess)
            .catch(() => {
                document.getElementById('result').innerHTML = `<div class="card">Hardware-Zugriff verweigert. Browser-Berechtigungen prüfen.</div>`;
                document.getElementById('result').style.display = "flex";
                document.getElementById('startBtn').style.display = "block";
                document.getElementById('reader-container').style.display = "none";
            });
        });
    </script>
</body>
</html>
