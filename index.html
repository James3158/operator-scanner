<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Operator Scanner</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --matrix-green: #00ff41; --bg-color: #0d0d0d; --box-bg: #1a1a1a; --border-radius: 12px; }
        body { background-color: var(--bg-color); color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        h2 { font-size: 1.2rem; font-weight: 600; color: #fff; letter-spacing: 1px; width: 100%; max-width: 400px; text-align: center; margin-bottom: 20px; }
        
        /* Vollbild-Scanner ohne sichtbaren Rahmen */
        #reader { display: none; width: 100%; max-width: 400px; border-radius: var(--border-radius); overflow: hidden; background: #000; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5); position: relative; }
        #reader video { object-fit: cover; border-radius: var(--border-radius); }
        /* Blendet die störende UI der Scanner-Bibliothek aus */
        #reader img, #reader span, #reader a, #reader div[style*="border"] { display: none !important; }
        
        #result { margin-top: 20px; padding: 20px; border-radius: var(--border-radius); background: var(--box-bg); width: 100%; max-width: 360px; min-height: 100px; font-size: 14px; text-align: left; word-wrap: break-word; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        
        button { background: #222; color: #fff; border: 1px solid #444; border-radius: var(--border-radius); padding: 18px; font-weight: 600; margin-top: 20px; font-size: 16px; width: 100%; max-width: 400px; cursor: pointer; transition: 0.2s; }
        button:active { background: #333; transform: scale(0.98); }
        
        .alert { color: #ff3b30; font-weight: 600; margin-top: 15px; border-left: 3px solid #ff3b30; padding-left: 12px; background: rgba(255, 59, 48, 0.1); padding-block: 10px; border-radius: 0 4px 4px 0; }
        .clean { color: #34c759; font-weight: 600; margin-top: 15px; border-left: 3px solid #34c759; padding-left: 12px; background: rgba(52, 199, 89, 0.1); padding-block: 10px; border-radius: 0 4px 4px 0; }
        .info-text { color: #8e8e93; font-size: 12px; margin-top: 8px; display: block; line-height: 1.5; }
        .category-badge { display: inline-block; background: #333; font-size: 10px; padding: 3px 8px; border-radius: 10px; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    </style>
</head>
<body>
    <h2>DATA EXTRACTION</h2>
    <div id="reader"></div>
    <button id="startBtn">Scanner Aktivieren</button>
    <div id="result">System initialisiert.<br>Warte auf Input.</div>

    <script>
        let blacklist = {};
        let html5QrCode;

        // Blacklist laden
        fetch('blacklist.json')
            .then(response => response.json())
            .then(data => { blacklist = data; })
            .catch(() => document.getElementById('result').innerHTML = "Fehler: Blacklist offline.");

        function analyzeProduct(data, category) {
            let p = data.product;
            // Alle Datenquellen kombinieren, um Verstecktes (wie bei Toffifee) zu finden
            let ingredientsRaw = [
                p.ingredients_text_de || "",
                p.ingredients_text_en || "",
                p.ingredients_text || "",
                p.ingredients_tags ? p.ingredients_tags.join(" ") : ""
            ].join(" ").toLowerCase();

            let productName = p.product_name || "Unbekannte Identität";
            
            if (ingredientsRaw.trim() === "") {
                document.getElementById('result').innerHTML = `<span class="category-badge">${category}</span><br><strong style="font-size:16px;">${productName}</strong><br><span class='alert'>Datenbank manipuliert. Keine Inhaltsstoffe extrahierbar. Konsum verweigern.</span>`;
                return;
            }
            
            let analysis = `<span class="category-badge">${category}</span><br><strong style="font-size:16px;">${productName}</strong><br><span class="info-text">${p.ingredients_text_de || p.ingredients_text || "Zutaten aus Metadaten extrahiert."}</span><br>`;
            let foundToxins = [];

            for (let toxin in blacklist) {
                if (ingredientsRaw.includes(toxin.toLowerCase())) {
                    foundToxins.push(`${toxin.toUpperCase()}: ${blacklist[toxin]}`);
                }
            }

            if (foundToxins.length > 0) {
                analysis += `<div class="alert">TOXISCHE SIGNATUR ERKANNT:<br><br>- ${foundToxins.join('<br>- ')}</div>`;
            } else {
                analysis += `<div class="clean">STATUS REIN.<br>Keine programmierten Toxine detektiert.</div>`;
            }
            
            document.getElementById('result').innerHTML = analysis;
        }

        function onScanSuccess(decodedText) {
            html5QrCode.stop().then(() => {
                document.getElementById('reader').style.display = "none";
                document.getElementById('startBtn').style.display = "block";
                document.getElementById('startBtn').innerText = "Neuer Scan";
                
                document.getElementById('result').innerHTML = `Signatur [${decodedText}] erfasst.<br>Frage Food-Sektor ab...`;
                
                // Kaskade 1: Open Food Facts
                fetch(`https://world.openfoodfacts.org/api/v0/product/${decodedText}.json`)
                    .then(res => res.json())
                    .then(data => {
                        if (data.status === 1) {
                            analyzeProduct(data, "Nahrungsmittel");
                        } else {
                            // Kaskade 2: Open Beauty Facts (Kosmetik)
                            document.getElementById('result').innerHTML = `Nicht in Food-Sektor gefunden.<br>Wechsle zu Kosmetik-Sektor...`;
                            fetch(`https://world.openbeautyfacts.org/api/v0/product/${decodedText}.json`)
                                .then(resB => resB.json())
                                .then(dataB => {
                                    if (dataB.status === 1) {
                                        analyzeProduct(dataB, "Kosmetik / Pflege");
                                    } else {
                                        document.getElementById('result').innerHTML = `<span class='alert'>Objekt [${decodedText}] in keiner Datenbank katalogisiert. Black-Box Produkt.</span>`;
                                    }
                                });
                        }
                    })
                    .catch(() => {
                        document.getElementById('result').innerHTML = "Server-Interferenz. API blockiert.";
                    });
            });
        }

        document.getElementById('startBtn').addEventListener('click', () => {
            document.getElementById('startBtn').style.display = "none";
            document.getElementById('reader').style.display = "block";
            document.getElementById('result').innerHTML = "Optischer Sensor aktiv. Erfasse gesamten Bereich...";
            
            html5QrCode = new Html5Qrcode("reader");
            
            // Konfiguration OHNE qrbox = Vollbild-Erfassung. Kamera kann weiter weg gehalten werden.
            const config = { 
                fps: 30,
                formatsToSupport: [
                    Html5QrcodeSupportedFormats.EAN_13,
                    Html5QrcodeSupportedFormats.EAN_8,
                    Html5QrcodeSupportedFormats.UPC_A
                ],
                videoConstraints: {
                    facingMode: "environment",
                    width: { ideal: 1920 },
                    height: { ideal: 1080 },
                    advanced: [{ focusMode: "continuous" }]
                }
            };

            html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess)
            .catch(() => {
                document.getElementById('result').innerHTML = "Hardware-Zugriff blockiert.";
                document.getElementById('startBtn').style.display = "block";
                document.getElementById('reader').style.display = "none";
            });
        });
    </script>
</body>
</html><!DOCTYPE html>

    <h2>Operator Interface</h2>
    <div id="reader"></div>
    <button id="startBtn">Sensor Aktivieren</button>
    <div id="result">System initialisiert.<br>Warte auf Input.</div>

    <script>
        let blacklist = {};
        let html5QrCode;

        fetch('blacklist.json')
            .then(response => response.json())
            .then(data => { blacklist = data; })
            .catch(() => document.getElementById('result').innerHTML = "Fehler: Blacklist offline.");

        function onScanSuccess(decodedText) {
            // 1. Kamera sofort stoppen
            html5QrCode.stop().then(() => {
                // 2. Kamera-Fenster komplett ausblenden
                document.getElementById('reader').style.display = "none";
                
                // 3. Button für neuen Scan wieder einblenden
                document.getElementById('startBtn').style.display = "block";
                document.getElementById('startBtn').innerText = "Neuer Scan";
                
                // 4. API-Abfrage starten
                document.getElementById('result').innerHTML = `Signatur [${decodedText}] erfasst im Speicher.<br>Sensoren offline. Analysiere Daten...`;
                
                fetch(`https://world.openfoodfacts.org/api/v0/product/${decodedText}.json`)
                    .then(res => res.json())
                    .then(data => {
                        if (data.status !== 1) {
                            document.getElementById('result').innerHTML = "<span class='alert'>Objekt nicht katalogisiert. Konsum verweigern.</span>";
                            return;
                        }
                        
                        let ingredients = data.product.ingredients_text_de || data.product.ingredients_text || "Keine Zutatenliste verfügbar.";
                        ingredients = ingredients.toLowerCase();
                        let productName = data.product.product_name || "Unbekannte Identität";
                        
                        let analysis = `<strong style="color:#fff; font-size:15px;">${productName}</strong><br><span class="info-text">${ingredients}</span><br>`;
                        let foundToxins = [];

                        for (let toxin in blacklist) {
                            if (ingredients.includes(toxin.toLowerCase())) {
                                foundToxins.push(`${toxin.toUpperCase()}: ${blacklist[toxin]}`);
                            }
                        }

                        if (foundToxins.length > 0) {
                            analysis += `<div class="alert">TOXISCHE SIGNATUR ERKANNT:<br><br>- ${foundToxins.join('<br>- ')}</div>`;
                        } else {
                            analysis += `<div class="clean">STATUS REIN.<br>Keine programmierten Toxine detektiert.</div>`;
                        }
                        
                        document.getElementById('result').innerHTML = analysis;
                    })
                    .catch(() => {
                        document.getElementById('result').innerHTML = "Server-Interferenz. API nicht erreichbar.";
                    });
            });
        }

        document.getElementById('startBtn').addEventListener('click', () => {
            // UI anpassen
            document.getElementById('startBtn').style.display = "none";
            document.getElementById('reader').style.display = "block"; // Kamera-Fenster anzeigen
            document.getElementById('result').innerHTML = "Sensor aktiv. Fokussiere 1D-Barcode...";
            
            html5QrCode = new Html5Qrcode("reader");
            
            // Konfiguration für maximale Geschwindigkeit
            const config = { 
                fps: 30, // Erhöht von 15 auf 30 für schnellere Erfassung
                qrbox: { width: 300, height: 100 }, // Schmaler, perfekt für EAN
                formatsToSupport: [
                    Html5QrcodeSupportedFormats.EAN_13,
                    Html5QrcodeSupportedFormats.EAN_8
                ],
                videoConstraints: {
                    facingMode: "environment",
                    width: { ideal: 1920 },
                    height: { ideal: 1080 },
                    advanced: [{ focusMode: "continuous" }]
                }
            };

            html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess)
            .catch(() => {
                document.getElementById('result').innerHTML = "Hardware-Zugriff verweigert.";
                document.getElementById('startBtn').style.display = "block";
                document.getElementById('reader').style.display = "none";
            });
        });
    </script>
</body>
